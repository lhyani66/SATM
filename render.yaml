services:
  - type: web
    name: satm
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
      # Neon PostgreSQL connection string.
      # sync: false = set this in the Render dashboard, never commit it.
      - key: DATABASE_URL
        sync: false
